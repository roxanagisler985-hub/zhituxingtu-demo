    <!DOCTYPE html>
    <html lang="zh-CN">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>职途星图 · AI 求职匹配平台</title>

    <!-- Preload critical assets -->
    <link rel="preload" href="css/style.css" as="style">
    <link rel="modulepreload" href="js/app.js">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Icons (inline SVG sprite) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🌟</text></svg>">
    </head>
    <body>

    <!-- Toast notification -->
    <div class="toast" id="toast" role="alert" aria-live="polite"></div>

    <!-- App Container -->
    <div class="phone" id="app">
      <!-- Header -->
      <header class="phone-header">
        <h1 class="title">
          <svg class="logo-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
          职途星图
        </h1>
        <span class="badge">v2.0 · Demo</span>
      </header>

      <!-- Main Content -->
      <main class="phone-body" id="body" role="tabpanel">
        <!-- Dynamic content rendered by JS -->
      </main>

      <!-- Tab Navigation -->
      <nav class="tabs" role="tablist">
        <button class="tab active" role="tab" aria-selected="true" data-tab="resume" aria-controls="body">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <span>简历优化</span>
        </button>
        <button class="tab" role="tab" aria-selected="false" data-tab="match" aria-controls="body">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 8l-4 8-4-4"/></svg>
          <span>智能匹配</span>
        </button>
        <button class="tab" role="tab" aria-selected="false" data-tab="leaders" aria-controls="body">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5C7 4 6 9 6 9z"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5C17 4 18 9 18 9z"/><path d="M4 22h16"/><path d="M10 22V2h4v20"/></svg>
          <span>龙头榜单</span>
        </button>
        <button class="tab" role="tab" aria-selected="false" data-tab="salary" aria-controls="body">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          <span>薪资查询</span>
        </button>
      </nav>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/matcher.js"></script>
    <script src="js/app.js"></script>
    </body>
    </html>
