<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>职途星图 STARmap · Demo</title>
<style>
:root {
  --primary: #4f46e5;
  --primary-dark: #4338ca;
  --primary-light: #eef2ff;
  --bg: #f0f2f7;
  --card: #fff;
  --text: #1e293b;
  --text2: #64748b;
  --text3: #94a3b8;
  --border: #e8ecf1;
  --green: #10b981;
  --red: #ef4444;
  --amber: #f59e0b;
  --radius: 14px;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
}

*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif;
  background:#1a1a2e;
  display:flex;justify-content:center;align-items:center;
  min-height:100vh;padding:20px;
}

/* Phone Frame */
.phone{
  width:390px;height:844px;
  background:var(--bg);
  border-radius:32px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,0.4),0 0 0 3px #333,0 0 0 6px #1a1a2e;
  display:flex;flex-direction:column;
  position:relative;
}
.phone-header{
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  color:#fff;
  padding:14px 20px;
  display:flex;align-items:center;
  justify-content:space-between;
  font-weight:600;
  font-size:0.95rem;
  flex-shrink:0;
}
.phone-header .title{font-size:1rem;letter-spacing:0.02em;}
.phone-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;}

/* Bottom Tabs */
.tabs{
  display:flex;
  background:var(--card);
  border-top:1px solid var(--border);
  flex-shrink:0;
}
.tab{
  flex:1;padding:8px 4px;
  border:none;background:none;
  cursor:pointer;
  display:flex;flex-direction:column;
  align-items:center;gap:3px;
  color:var(--text3);
  font-size:0.7rem;
  transition:color 0.2s;
}
.tab.active{color:var(--primary);}
.tab .icon{font-size:1.25rem;}

/* Cards */
.card{
  background:var(--card);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}
.card h3{font-size:0.95rem;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.card p{font-size:0.82rem;color:var(--text2);line-height:1.6;}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:10px 22px;border-radius:22px;
  font-size:0.85rem;font-weight:600;
  border:none;cursor:pointer;
  transition:all 0.2s;
}
.btn-primary{
  background:var(--primary);color:#fff;
}
.btn-primary:active{transform:scale(0.96);background:var(--primary-dark);}
.btn-outline{
  background:#fff;color:var(--primary);border:2px solid var(--primary);
}
.btn-sm{padding:6px 14px;font-size:0.78rem;border-radius:16px;}

/* Chat */
.chat-list{display:flex;flex-direction:column;gap:10px;max-height:340px;overflow-y:auto;}
.chat-msg{
  max-width:85%;padding:10px 14px;border-radius:16px;
  font-size:0.83rem;line-height:1.5;
  animation:msgIn 0.3s ease;
}
@keyframes msgIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.chat-msg.ai{
  align-self:flex-start;
  background:#f1f5f9;color:var(--text);
  border-bottom-left-radius:4px;
}
.chat-msg.user{
  align-self:flex-end;
  background:var(--primary);color:#fff;
  border-bottom-right-radius:4px;
}
.chat-msg .typing{display:flex;gap:4px;padding:4px 0;}
.chat-msg .typing span{
  width:7px;height:7px;border-radius:50%;background:var(--text3);
  animation:dot 1.4s infinite;
}
.chat-msg .typing span:nth-child(2){animation-delay:0.2s;}
.chat-msg .typing span:nth-child(3){animation-delay:0.4s;}
@keyframes dot{0%,60%,100%{opacity:0.2;transform:scale(0.8);}30%{opacity:1;transform:scale(1.2);}}

.quick-replies{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.quick-reply{
  padding:7px 14px;border-radius:18px;border:1px solid var(--border);
  background:#fff;color:var(--primary);font-size:0.78rem;
  cursor:pointer;transition:all 0.2s;
}
.quick-reply:active{background:var(--primary-light);}

/* Radar Chart (Pure CSS) */
.radar-wrap{display:flex;justify-content:center;padding:12px 0;}
.radar{
  width:200px;height:200px;
  position:relative;
}
.radar svg{width:100%;height:100%;}

/* Progress bars */
.bar-wrap{margin:6px 0;}
.bar-label{display:flex;justify-content:space-between;font-size:0.78rem;color:var(--text2);margin-bottom:2px;}
.bar-label .val{font-weight:600;color:var(--text);}
.bar-track{height:8px;border-radius:4px;background:#e8ecf1;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;transition:width 0.8s ease;}
.bar-fill.green{background:linear-gradient(90deg,#10b981,#34d399);}
.bar-fill.blue{background:linear-gradient(90deg,#4f46e5,#818cf8);}
.bar-fill.purple{background:linear-gradient(90deg,#7c3aed,#a78bfa);}

/* Resume card */
.resume-preview{
  border:1px solid var(--border);border-radius:10px;
  padding:14px;font-size:0.78rem;line-height:1.7;
  background:#fafbfc;
}
.resume-preview .highlight{background:#fef3c7;padding:1px 0;border-radius:2px;}
.resume-preview .badge{
  display:inline-block;padding:2px 8px;border-radius:10px;
  font-size:0.7rem;font-weight:600;
}
.badge.good{background:#d1fae5;color:#065f46;}

/* Interview */
.interview-avatar{
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  display:flex;align-items:center;justify-content:center;
  font-size:1.8rem;color:#fff;margin:0 auto 10px;
}
.score-ring{
  width:70px;height:70px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;font-weight:700;
  position:relative;
}
.score-ring::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  border:4px solid #e8ecf1;
}
.score-ring.high::before{border-color:#10b981;}
.score-ring.mid::before{border-color:#f59e0b;}

/* Stats grid */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat{
  background:var(--card);border-radius:var(--radius);
  padding:14px;text-align:center;box-shadow:var(--shadow);
}
.stat .num{font-size:1.5rem;font-weight:700;color:var(--primary);}
.stat .lbl{font-size:0.72rem;color:var(--text2);margin-top:2px;}

/* Offer compare */
.compare-table{width:100%;font-size:0.75rem;border-collapse:collapse;}
.compare-table th,.compare-table td{
  padding:8px 6px;text-align:center;
  border-bottom:1px solid var(--border);
}
.compare-table th{background:#f8fafc;font-weight:600;color:var(--text2);}
.compare-table .win{color:#10b981;font-weight:600;}
.compare-table td:first-child{text-align:left;color:var(--text2);font-size:0.72rem;}

/* Segment badge */
.segment{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 10px;border-radius:12px;
  font-size:0.7rem;font-weight:600;
}
.segment.diamond{background:#ede9fe;color:#5b21b6;}

/* Voice button */
.voice-btn{
  width:60px;height:60px;border-radius:50%;
  border:none;background:linear-gradient(135deg,#ef4444,#dc2626);
  color:#fff;font-size:1.6rem;cursor:pointer;
  transition:all 0.2s;display:flex;align-items:center;justify-content:center;
  margin:10px auto;
  animation:pulse 1.8s infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.4);}
  50%{box-shadow:0 0 0 16px rgba(239,68,68,0);}
}
.voice-btn.recording{animation:none;background:#dc2626;box-shadow:0 0 0 12px rgba(220,38,38,0.3);}

/* Offer card */
.offer-card{
  border:2px solid var(--border);border-radius:var(--radius);
  padding:14px;text-align:center;transition:all 0.2s;
}
.offer-card.best{border-color:#10b981;background:#f0fdf4;}
.offer-card .company{font-weight:700;font-size:0.9rem;}
.offer-card .salary{font-size:1.2rem;font-weight:700;color:var(--primary);margin:4px 0;}
.offer-card .tag{font-size:0.7rem;color:var(--text2);}

/* Empty state animation */
.empty-anim{text-align:center;padding:30px;}
.empty-anim .icon{font-size:3rem;animation:float 3s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}

/* Scrollbar */
.phone-body::-webkit-scrollbar{width:4px;}
.phone-body::-webkit-scrollbar-track{background:transparent;}
.phone-body::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:2px;}

/* Toast */
.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);
  background:#1e293b;color:#fff;padding:10px 24px;border-radius:22px;
  font-size:0.85rem;z-index:100;opacity:0;transition:opacity 0.3s;
}
.toast.show{opacity:1;}

/* Audio visualizer */
.visualizer{display:flex;align-items:center;justify-content:center;gap:3px;height:30px;}
.visualizer .bar{
  width:3px;border-radius:2px;background:var(--primary);
  animation:vis 0.8s ease-in-out infinite;
}
.visualizer .bar:nth-child(1){height:12px;animation-delay:0s;}
.visualizer .bar:nth-child(2){height:20px;animation-delay:0.1s;}
.visualizer .bar:nth-child(3){height:28px;animation-delay:0.2s;}
.visualizer .bar:nth-child(4){height:18px;animation-delay:0.3s;}
.visualizer .bar:nth-child(5){height:22px;animation-delay:0.4s;}
.visualizer .bar:nth-child(6){height:10px;animation-delay:0.5s;}
.visualizer .bar:nth-child(7){height:26px;animation-delay:0.6s;}
@keyframes vis{0%,100%{transform:scaleY(1);}50%{transform:scaleY(0.4);}}

@media(max-width:420px){
  .phone{width:100%;height:100vh;border-radius:0;box-shadow:none;}
  body{padding:0;}
}
</style>
</head>
<body>

<div class="phone">
  <div class="phone-header">
    <span>🌟 职途星图</span>
    <span style="font-size:0.75rem;opacity:0.85">STARmap</span>
  </div>

  <div class="phone-body" id="body">
    <!-- Content rendered by JS -->
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="compass">
      <span class="icon">🧭</span>职业罗盘
    </button>
    <button class="tab" data-tab="resume">
      <span class="icon">⚡</span>简历引擎
    </button>
    <button class="tab" data-tab="interview">
      <span class="icon">🎭</span>面试训练
    </button>
    <button class="tab" data-tab="map">
      <span class="icon">🗺️</span>作战地图
    </button>
    <button class="tab" data-tab="offer">
      <span class="icon">🧠</span>Offer
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── State ──
let currentTab = 'compass';
let compassStep = 0;
let resumeStep = 0;
let interviewStep = 0;
let radarData = null;

// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ── Tab Navigation ──
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    currentTab = tab.dataset.tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    renderTab(currentTab);
  });
});

// ── SVG Radar Chart ──
function radarSVG(scores) {
  const labels = ['逻辑思维','沟通表达','创意设计','数据分析','项目管理','技术实践','领导协作'];
  const cx=100,cy=100,r=75,levels=5;
  const angles = labels.map((_,i)=> (Math.PI*2*i/labels.length) - Math.PI/2);

  let svg = `<svg viewBox="0 0 200 200">`;
  // Grid
  for(let l=1;l<=levels;l++){
    const pts = angles.map(a => `${cx+(r*l/levels)*Math.cos(a)},${cy+(r*l/levels)*Math.sin(a)}`).join(' ');
    svg += `<polygon points="${pts}" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>`;
  }
  // Axes
  angles.forEach(a => {
    svg += `<line x1="${cx}" y1="${cy}" x2="${cx+r*Math.cos(a)}" y2="${cy+r*Math.sin(a)}" stroke="#e2e8f0" stroke-width="0.5"/>`;
  });
  // Data
  const dataPts = scores.map((s,i) => {
    const val = s/100 * r;
    return `${cx+val*Math.cos(angles[i])},${cy+val*Math.sin(angles[i])}`;
  }).join(' ');
  svg += `<polygon points="${dataPts}" fill="rgba(79,70,229,0.25)" stroke="#4f46e5" stroke-width="2"/>`;
  // Dots
  scores.forEach((s,i) => {
    const val = s/100 * r;
    const x = cx+val*Math.cos(angles[i]), y = cy+val*Math.sin(angles[i]);
    svg += `<circle cx="${x}" cy="${y}" r="3" fill="#4f46e5"/>`;
  });
  // Labels
  labels.forEach((lb,i) => {
    const x = cx+(r+18)*Math.cos(angles[i]), y = cy+(r+18)*Math.sin(angles[i]);
    svg += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="7" fill="#64748b">${lb}</text>`;
  });
  svg += '</svg>';
  return svg;
}

// ── Render Functions ──
function renderTab(tab) {
  const body = document.getElementById('body');
  body.scrollTop = 0;
  switch(tab) {
    case 'compass': renderCompass(body); break;
    case 'resume': renderResume(body); break;
    case 'interview': renderInterview(body); break;
    case 'map': renderMap(body); break;
    case 'offer': renderOffer(body); break;
  }
  // Re-attach event listeners for the new content
  setTimeout(() => attachHandlers(tab), 100);
}

// ═══════════ 🧭 AI职业罗盘 ═══════════
function renderCompass(body) {
  if (compassStep === 0) {
    body.innerHTML = `
      <div class="card" style="text-align:center">
        <div class="empty-anim"><div class="icon">🧭</div></div>
        <h3 style="margin-bottom:8px">AI 职业罗盘</h3>
        <p>通过10分钟的AI深度对话<br>发现你真正的职业方向</p>
        <button class="btn btn-primary" style="margin-top:14px" id="startCompass">开始探索</button>
      </div>
      <div class="card">
        <h3>📊 你的能力雷达图</h3>
        <p style="text-align:center;color:var(--text3);padding:30px 0">完成对话后自动生成</p>
      </div>
    `;
  } else if (compassStep >= 1 && compassStep <= 5) {
    const msgs = getChatMessages(compassStep);
    const isLast = compassStep === 5;
    body.innerHTML = `
      <div class="card">
        <h3>🧭 AI 深度访谈</h3>
        <div class="chat-list" id="chatList"></div>
        ${!isLast ? `<div class="quick-replies" id="quickReplies"></div>` : ''}
      </div>
      ${isLast ? `
      <div class="card" style="text-align:center">
        <h3>🎉 分析完成！</h3>
        <div class="radar-wrap"><div class="radar">${radarSVG([82,75,68,70,88,45,62])}</div></div>
        <p style="margin:8px 0"><strong>你的七维能力雷达图</strong></p>
        <div style="background:#fef3c7;border-radius:10px;padding:12px;margin:8px 0">
          <p style="color:#92400e;font-size:0.8rem">💡 <strong>惊喜发现：</strong>你高度匹配 <b>"用户增长运营"</b>（匹配度91%）——一个你可能从未考虑过的方向！</p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
          ${['用户增长运营 91%','内容运营 87%','品牌营销 82%','产品运营 78%','活动策划 75%'].map(d => {
            const [n,s] = d.split(' ');
            return `<span class="segment diamond">🏷 ${n} ${s}</span>`;
          }).join('')}
        </div>
        <button class="btn btn-outline btn-sm" style="margin-top:12px" id="resetCompass">重新探索</button>
      </div>` : ''}
    `;
  }
}

function getChatMessages(step) {
  const all = [
    [{role:'ai',text:'嗨！我是你的AI职业导师 ✨<br><br>最近半年，有没有一件让你特别有成就感的事？可以是一个项目、一次活动、或者任何一个你觉得"做得不错"的时刻。'}],
    [{role:'ai',text:'嗨！我是你的AI职业导师 ✨<br><br>最近半年，有没有一件让你特别有成就感的事？可以是一个项目、一次活动、或者任何一个你觉得"做得不错"的时刻。'},{role:'user',text:'嗯…我在学校组织过一个夜市活动'}],
    [{role:'ai',text:'嗨！我是你的AI职业导师 ✨<br><br>最近半年，有没有一件让你特别有成就感的事？可以是一个项目、一次活动、或者任何一个你觉得"做得不错"的时刻。'},{role:'user',text:'嗯…我在学校组织过一个夜市活动'},{role:'ai',text:'太有意思了！🎪 跟我多说说——<br><br>你具体负责哪些事情？比如怎么把商家和学生都拉到一起的？'}],
    [{role:'ai',text:'嗨！我是你的AI职业导师 ✨<br><br>最近半年，有没有一件让你特别有成就感的事？可以是一个项目、一次活动、或者任何一个你觉得"做得不错"的时刻。'},{role:'user',text:'嗯…我在学校组织过一个夜市活动'},{role:'ai',text:'太有意思了！🎪 跟我多说说——<br><br>你具体负责哪些事情？比如怎么把商家和学生都拉到一起的？'},{role:'user',text:'我联系了20多家商家，最后来了12家。还拉了社团的同学来表演，现场人挺多的'}],
    [{role:'ai',text:'嗨！我是你的AI职业导师 ✨<br><br>最近半年，有没有一件让你特别有成就感的事？可以是一个项目、一次活动、或者任何一个你觉得"做得不错"的时刻。'},{role:'user',text:'嗯…我在学校组织过一个夜市活动'},{role:'ai',text:'太有意思了！🎪 跟我多说说——<br><br>你具体负责哪些事情？比如怎么把商家和学生都拉到一起的？'},{role:'user',text:'我联系了20多家商家，最后来了12家。还拉了社团的同学来表演，现场人挺多的'},{role:'ai',text:'这很厉害！让我总结一下你展现的能力：<br><br>🎯 <b>商务谈判</b>：60%转化率<br>🤝 <b>跨团队协作</b>：协调商家+社团<br>📋 <b>活动统筹</b>：从0到1落地<br><br>你在做这些的时候，有没有哪个环节让你觉得特别有干劲？'}],
  ];
  return all[step-1] || all[0];
}

function attachCompassHandlers() {
  const startBtn = document.getElementById('startCompass');
  if (startBtn) startBtn.addEventListener('click', () => { compassStep = 1; renderTab('compass'); });

  const resetBtn = document.getElementById('resetCompass');
  if (resetBtn) resetBtn.addEventListener('click', () => { compassStep = 0; renderTab('compass'); });

  const repliesDiv = document.getElementById('quickReplies');
  if (repliesDiv && compassStep < 5) {
    const replies = [
      ['组织过校园活动','在社团做过事','课程项目有成就感'],
      ['拉了很多商家参与','现场来了好多人','同学们反响很好'],
      ['联系商家和协调资源','看着活动从无到有','解决了突发问题'],
      ['沟通谈判最有干劲','看着想法变成现实','团队一起努力的时候'],
    ];
    const r = replies[compassStep-1] || replies[0];
    repliesDiv.innerHTML = r.map(t => `<button class="quick-reply">${t}</button>`).join('');
    repliesDiv.querySelectorAll('.quick-reply').forEach(btn => {
      btn.addEventListener('click', () => {
        const userMsg = btn.textContent;
        const chatList = document.getElementById('chatList');
        // Add user message
        const userEl = document.createElement('div');
        userEl.className = 'chat-msg user';
        userEl.textContent = userMsg;
        chatList.appendChild(userEl);
        // Disable replies
        repliesDiv.innerHTML = '';
        // Show typing then AI response
        const typingEl = document.createElement('div');
        typingEl.className = 'chat-msg ai';
        typingEl.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
        chatList.appendChild(typingEl);
        chatList.scrollTop = chatList.scrollHeight;
        setTimeout(() => {
          typingEl.remove();
          compassStep = Math.min(compassStep + 1, 5);
          renderTab('compass');
          const newChat = document.getElementById('chatList');
          if (newChat) newChat.scrollTop = newChat.scrollHeight;
        }, 1200 + Math.random() * 800);
      });
    });
  }

  // Render initial messages
  const chatList = document.getElementById('chatList');
  if (chatList && compassStep >= 1) {
    const msgs = getChatMessages(compassStep);
    chatList.innerHTML = msgs.map(m =>
      `<div class="chat-msg ${m.role}">${m.text}</div>`
    ).join('');
    chatList.scrollTop = chatList.scrollHeight;
  }
}

function attachResumeHandlers() {
  const startBtn = document.getElementById('startResume');
  if (startBtn) startBtn.addEventListener('click', () => { resumeStep = 1; renderTab('resume'); });

  const resetBtn = document.getElementById('resetResume');
  if (resetBtn) resetBtn.addEventListener('click', () => { resumeStep = 0; renderTab('resume'); });

  const voiceBtn = document.getElementById('voiceBtn');
  if (voiceBtn) {
    voiceBtn.addEventListener('click', () => {
      if (voiceBtn.classList.contains('recording')) return;
      voiceBtn.classList.add('recording');
      voiceBtn.textContent = '⏹';
      document.getElementById('voiceHint').textContent = '正在聆听...';
      document.getElementById('visualizer').style.display = 'flex';
      document.getElementById('visualizer').innerHTML = Array(7).fill(0).map(() => `<div class="bar"></div>`).join('');
      setTimeout(() => {
        voiceBtn.classList.remove('recording');
        voiceBtn.textContent = '🎤';
        document.getElementById('voiceHint').textContent = '录音完成';
        document.getElementById('visualizer').style.display = 'none';
        resumeStep = 2;
        setTimeout(() => renderTab('resume'), 600);
      }, 2500);
    });
  }

  const genBtn = document.getElementById('genResume');
  if (genBtn) {
    genBtn.addEventListener('click', () => {
      resumeStep = 3;
      renderTab('resume');
    });
  }
}
