*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#4f46e5;--primary-dark:#4338ca;--primary-light:#eef2ff;--bg:#f0f2f7;--card:#fff;--text:#1e293b;--text2:#64748b;--text3:#94a3b8;--border:#e8ecf1;--green:#10b981;--amber:#f59e0b;--radius:14px;--shadow:0 2px 12px rgba(0,0,0,0.06)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif;background:#1a1a2e;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.phone{width:430px;height:932px;background:var(--bg);border-radius:32px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.4),0 0 0 3px #333,0 0 0 6px #1a1a2e;display:flex;flex-direction:column;position:relative}
.phone-header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.phone-header .title{font-size:1rem;font-weight:600}
.phone-header .badge{background:rgba(255,255,255,0.2);padding:3px 10px;border-radius:12px;font-size:0.65rem}
.phone-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px}
.tabs{display:flex;background:var(--card);border-top:1px solid var(--border);flex-shrink:0}
.tab{flex:1;padding:7px 3px;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text3);font-size:0.62rem;transition:color 0.2s}
.tab.active{color:var(--primary)}
.tab .icon{font-size:1.15rem}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{font-size:0.88rem;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.card p{font-size:0.78rem;color:var(--text2);line-height:1.6}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 18px;border-radius:20px;font-size:0.8rem;font-weight:600;border:none;cursor:pointer;transition:all 0.2s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:active{transform:scale(0.96)}
.btn-outline{background:#fff;color:var(--primary);border:2px solid var(--primary)}
.btn-sm{padding:5px 12px;font-size:0.72rem;border-radius:14px}
.input-group{margin:6px 0}
.input-group label{font-size:0.75rem;color:var(--text2);display:block;margin-bottom:3px;font-weight:500}
.input-group textarea,.input-group input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:0.8rem;font-family:inherit}
.input-group textarea{resize:vertical;min-height:60px}
.input-group textarea:focus,.input-group input:focus{outline:none;border-color:var(--primary)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:12px;text-align:center;box-shadow:var(--shadow)}
.stat-card .num{font-size:1.3rem;font-weight:700;color:var(--primary)}
.stat-card .lbl{font-size:0.7rem;color:var(--text2);margin-top:2px}
.segment{display:inline-flex;align-items:center;padding:2px 8px;border-radius:8px;font-size:0.62rem;font-weight:500}
.segment.green{background:#d1fae5;color:#065f46}
.segment.blue{background:#eef2ff;color:var(--primary)}
.segment.amber{background:#fef3c7;color:#92400e}
.segment.gray{background:#f1f5f9;color:#475569}
.bar-wrap{margin:5px 0}
.bar-label{display:flex;justify-content:space-between;font-size:0.73rem;color:var(--text2);margin-bottom:2px}
.bar-label .val{font-weight:600;color:var(--text)}
.bar-track{height:6px;border-radius:3px;background:#e8ecf1;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width 0.6s ease}
.bar-fill.green{background:linear-gradient(90deg,#10b981,#34d399)}
.bar-fill.blue{background:linear-gradient(90deg,#4f46e5,#818cf8)}
.bar-fill.purple{background:linear-gradient(90deg,#7c3aed,#a78bfa)}
.search-bar{display:flex;gap:6px;margin-bottom:8px}
.search-bar input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:0.8rem;font-family:inherit}
.search-bar input:focus{outline:none;border-color:var(--primary)}
.leader-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.leader-item:last-child{border-bottom:none}
.leader-rank{width:22px;font-weight:700;font-size:0.9rem;color:var(--text3);text-align:center}
.match-card{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
.match-card .top{display:flex;justify-content:space-between;align-items:center}
.match-card .company{font-weight:700;font-size:0.82rem;color:var(--text)}
.match-card .score{font-weight:700;font-size:0.9rem}
.match-card .score.high{color:#10b981}
.match-card .score.mid{color:#f59e0b}
.match-card .score.low{color:var(--text3)}
.match-card .pos{font-size:0.72rem;color:var(--text2);margin-top:1px}
.filter-btn{padding:4px 10px;border-radius:14px;border:1px solid var(--border);font-size:0.68rem;background:#fff;color:var(--text2);cursor:pointer;white-space:nowrap}
.filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pagination{display:flex;justify-content:center;align-items:center;gap:6px;padding:8px 0}
.page-btn{min-width:28px;padding:4px 8px;border-radius:6px;border:1px solid var(--border);font-size:0.72rem;background:#fff;color:var(--text2);cursor:pointer}
.page-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.page-btn:disabled{opacity:0.3;cursor:default}
.api-status{padding:6px 12px;border-radius:8px;font-size:0.72rem;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.api-status.online{background:#d1fae5;color:#065f46}
.phone-body::-webkit-scrollbar{width:3px}
.phone-body::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:2px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:8px 20px;border-radius:20px;font-size:0.78rem;z-index:100;opacity:0;transition:opacity 0.3s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:440px){.phone{width:100%;height:100vh;border-radius:0;box-shadow:none}body{padding:0}}
</style>

var ms=0,mp=1,P20=20,mq="",mf="";
function rml(){
  if(ms==0){

    $("s2").onclick=function(){ms=1;mp=1;rml()};
    return
  }
  if(ms==1){
    var arr=AC.slice();
    if(mq){var qq=mq.toLowerCase();arr=arr.filter(function(c){return c.company.toLowerCase().includes(qq)||c.pos.toLowerCase().includes(qq)||c.dept.toLowerCase().includes(qq)})}
    if(mf){arr=arr.filter(function(c){return c.industry===mf})}
    var tp=Math.ceil(arr.length/P20),st=(mp-1)*P20,pg=arr.slice(st,st+P20);
    var filterBtns='<button class="filter-btn'+(mf===""?" active":"")+'" data-mfi="">全部行业</button>';
    AI.forEach(function(i){filterBtns+='<button class="filter-btn'+(mf===i?" active":"")+'" data-mfi="'+i+'">'+i+'</button>'});
    bd().innerHTML='<div class="card"><h3>🎯 搜索匹配岗位</h3><div class="search-bar"><input placeholder="搜索公司名、职位、部门…" id="msi" value="'+mq.replace(/"/g,"&quot;")+'"><button class="btn btn-primary btn-sm" id="msb">搜索</button></div><div class="filter-row" style="display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px">'+filterBtns+'</div><div style="font-size:0.72rem;color:var(--text3);margin-bottom:6px">共匹配 <strong>'+arr.length+'</strong> 个岗位 · 第 '+mp+'/'+tp+' 页</div><div id="mlc"></div></div>';
    var mc=$("mlc");
    if(!pg.length){mc.innerHTML='<p style="text-align:center;color:var(--text3);padding:20px">没有匹配的公司</p>';attachML();return}
    mc.innerHTML=pg.map(function(c){
      var cl=c.match>=80?"high":c.match>=65?"mid":"low";
      return '<div class="match-card" style="border-left:3px solid '+(c.match>=80?"var(--green)":c.match>=65?"var(--amber)":"var(--border)")+'"><div class="top"><span class="company">'+c.company+'</span><span class="score '+cl+'">'+c.match+'%</span></div><div class="pos">'+c.pos+" · "+c.dept+" · "+c.city+'</div><div style="display:flex;gap:4px;margin-top:3px"><span class="segment gray">'+c.industry+'</span><span class="segment green">'+c.stage+'</span><span class="segment gray">'+c.size+'</span></div></div>'
    }).join("");
    if(tp>1){
      var pdiv='<div class="pagination" style="display:flex;justify-content:center;align-items:center;gap:6px;padding:8px 0"><button class="page-btn'+(mp<=1?" disabled":"")+'" id="mpp">‹</button>';
      for(var i=Math.max(1,mp-2);i<=Math.min(tp,mp+2);i++)pdiv+='<button class="page-btn'+(i===mp?" active":"")+'" data-pg="'+i+'">'+i+'</button>';
      pdiv+='<button class="page-btn'+(mp>=tp?" disabled":"")+'" id="mpn">›</button></div>';
      mc.insertAdjacentHTML("afterend",pdiv);
    }
    mc.insertAdjacentHTML("afterend",'<button class="btn btn-primary" style="width:100%;margin-top:8px" id="smr2">📊 查看匹配分析结果</button>');
    attachML();
    return
  }
  if(ms>=2){
    var sa=AC.slice().sort(function(a,b){return b.match-a.match});
    var top10=sa.slice(0,10),best=top10[0];
    var listHTML="";

    });
    var kw=85+Math.floor(Math.random()*10),ex=75+Math.floor(Math.random()*15),ed=75+Math.floor(Math.random()*15);
    bd().innerHTML='<div class="card" style="text-align:center;border:2px solid var(--green);background:#f0fdf4"><h3>✅ 匹配分析完成</h3><div style="margin:10px 0"><span style="font-size:2.2rem;font-weight:700;color:var(--green)">'+best.match+'%</span><p style="font-size:0.78rem;color:var(--text2)">最佳匹配：'+best.company+" · "+best.pos+'</p></div><span class="segment green" style="font-size:0.8rem">🎯 Top-5 准确率 78%</span></div><div class="card"><h3>🏆 Top-10 推荐排序</h3>'+listHTML+'</div><div class="card"><h3>💪 '+best.company+' 匹配分析</h3><div class="bar-wrap"><div class="bar-label"><span>关键词覆盖率</span><span class="val">'+kw+'%</span></div><div class="bar-track"><div class="bar-fill green" style="width:'+kw+'%"></div></div></div><div class="bar-wrap"><div class="bar-label"><span>经历匹配度</span><span class="val">'+ex+'%</span></div><div class="bar-track"><div class="bar-fill blue" style="width:'+ex+'%"></div></div></div><div class="bar-wrap"><div class="bar-label"><span>教育背景</span><span class="val">'+ed+'%</span></div><div class="bar-track"><div class="bar-fill purple" style="width:'+ed+'%"></div></div></div></div><div style="display:flex;gap:8px"><button class="btn btn-outline" style="flex:1" id="rm2">重新匹配</button><button class="btn btn-primary" style="flex:1" id="va2">查看全部推荐</button></div>';
    $("rm2").onclick=function(){ms=1;mp=1;rml()};
    $("va2").onclick=function(){ms=1;mp=1;rml()}
  }
}

function attachML(){
  var inp=$("msi"),btn=$("msb");
  if(inp)inp.onkeydown=function(e){if(e.key==="Enter"){mq=inp.value;mp=1;rml()}};
  if(btn)btn.onclick=function(){mq=$("msi").value;mp=1;rml()};
  document.querySelectorAll("[data-mfi]").forEach(function(el){el.onclick=function(){mf=el.dataset.mfi||"";mp=1;rml()}});
  document.querySelectorAll("[data-pg]").forEach(function(el){el.onclick=function(){mp=parseInt(el.dataset.pg);rml()}});
  var pp=$("mpp");if(pp)pp.onclick=function(){if(mp>1){mp--;rml()}};
  var pn=$("mpn");if(pn)pn.onclick=function(){var a=AC.slice();if(mf)a=a.filter(function(c){return c.industry===mf});if(mp<Math.ceil(a.length/P20)){mp++;rml()}};
  var sr=$("smr2");if(sr)sr.onclick=function(){ms=2;rml()}
}

render("match");
