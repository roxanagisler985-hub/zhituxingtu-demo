<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>职途星图 · AI 求职匹配平台</title>

<link rel="preload" href="css/style.css" as="style">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🌟</text></svg>">
</head>
<body>

<!-- Toast -->
<div class="toast" id="toast" role="alert" aria-live="polite"></div>

<!-- App Layout -->
<div id="app">
  <!-- Top Bar -->
  <header id="topbar">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
      </svg>
      职途星图
    </div>
    <nav class="top-nav" role="tablist">
      <button class="top-tab active" role="tab" aria-selected="true" data-tab="resume">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        简历优化
      </button>
      <button class="top-tab" role="tab" aria-selected="false" data-tab="match">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M16 8l-4 8-4-4"/></svg>
        智能匹配
      </button>
      <button class="top-tab" role="tab" aria-selected="false" data-tab="leaders">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5C7 4 6 9 6 9z"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5C17 4 18 9 18 9z"/><path d="M4 22h16"/><path d="M10 22V2h4v20"/></svg>
        龙头榜单
      </button>
      <button class="top-tab" role="tab" aria-selected="false" data-tab="salary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        薪资查询
      </button>
    </nav>
    <span class="badge">v2.0 Demo</span>
  </header>

  <!-- Main Content -->
  <main id="body" role="tabpanel"></main>
</div>

<!-- Scripts -->
<script src="js/data.js"></script>
<script src="js/matcher.js"></script>
<script src="js/app.js"></script>
</body>
</html>
